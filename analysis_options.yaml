include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - .tooling/**
    - .toolchains/**
    - .fvm/**
    - build/**
    # 당시 도구 비교 자료는 해당 패키지 설정으로 검증한다.
    - tool/model_comparison/**

linter:
  rules:
    # 기존 공개 계약의 문서 누락은 계약 점검표에서 추적한다.
    public_member_api_docs: false
    # 한국어 업무 설명의 자연스러운 줄 길이를 허용한다.
    lines_longer_than_80_chars: false
    # 기존 값 모델의 선언 문맥·Dart 표기를 일괄 변경하지 않는다.
    unnecessary_type_name_in_constructor: false
    sort_constructors_first: false
    unnecessary_lambdas: false
    # JSON 구조 검사 후의 명시적 cast와 음성 테스트는 허용한다.
    cast_nullable_to_non_nullable: false
    # 원인별 테스트 분기와 순차적인 검증 코드의 가독성을 유지한다.
    no_default_cases: false
    prefer_foreach: false
    cascade_invocations: false
