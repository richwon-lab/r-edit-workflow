name: Local-contract checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      windows_build:
        description: Windows 앱 빌드도 실행
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 공개 저장소의 표준 러너는 무료. 비공개는 예산 확인 후 명시적으로 활성화한다.
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUB_CACHE: ${{ runner.temp }}/pub-cache
      FVM_CACHE_PATH: ${{ runner.temp }}/fvm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      - name: Install project SDK through FVM
        run: |
          dart pub global activate fvm 4.3.2
          fvm install
          fvm use --force --skip-pub-get
      - name: Generate, analyze, test and verify consumers
        run: fvm dart tool/verify.dart
